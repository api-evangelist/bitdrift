apis:
- name: bitdrift Public API
  description: >-
    The bitdrift Capture public API — schema-first protobuf service definitions exposed over gRPC,
    Connect, and gRPC-over-JSON at api-public.bitdrift.io. Services under the bitdrift.public.unary.*
    package space cover Admin (API/SDK keys, connectors, views, notification groups), Workflows
    (create/deploy/query workflow-backed telemetry and captured sessions), Issues & Crashes,
    Dashboards & Charts, Timeline (session hydration, logs, spans, search), Alerts, Entities, and
    Debug files. Authentication is via an API key in the x-bitdrift-api-key header.
  humanURL: https://docs.bitdrift.io/api-guide/
  baseURL: https://api-public.bitdrift.io
