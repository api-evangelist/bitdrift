aid: bitdrift
name: bitdrift
description: >-
  bitdrift builds Capture, a cost-effective dynamic mobile observability platform for iOS, Android,
  and React Native. A lightweight on-device SDK stores high-volume telemetry locally and uploads only
  what is needed under real-time control from the bitdrift control plane, avoiding lengthy mobile
  release cycles to change what is collected. The platform surfaces Instant Insights dashboards,
  Workflows for custom metrics, funnels and session-capture rules, a Session Timeline for debugging,
  Issues & Crashes tracking, and Alerts. It is operated through a web portal and the `bd` CLI, and
  exposes a public, schema-first protobuf API over gRPC, Connect, and gRPC-over-JSON at
  api-public.bitdrift.io. bitdrift is a developer-tools company backed by Amplify Partners.
